
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MusiGlass Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.8);
            --primary: #6366f1;
        }

        body {
            background: radial-gradient(circle at 0% 0%, #f4f7ff, #ffffff);
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.08);
        }

        .liquid-orb {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            box-shadow: 
                0 45px 90px -15px rgba(99, 102, 241, 0.4),
                inset 0 -12px 24px rgba(0, 0, 0, 0.1),
                inset 0 12px 24px rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 8px solid #ffffff;
        }

        .liquid-orb:active {
            transform: scale(0.8) translateY(8px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.3);
        }

        .recording-pulse {
            animation: orb-pulse 1.8s ease-in-out infinite;
        }

        @keyframes orb-pulse {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4), 0 45px 90px -15px rgba(99, 102, 241, 0.4); }
            70% { box-shadow: 0 0 0 40px rgba(99, 102, 241, 0), 0 45px 90px -15px rgba(99, 102, 241, 0.4); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0), 0 45px 90px -15px rgba(99, 102, 241, 0.4); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        #pwa-install {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            animation: slideUp 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(150px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <!-- Install UI for APK feel -->
    <div id="pwa-install" class="glass-panel p-6 rounded-[2.5rem] flex items-center justify-between border-white shadow-2xl">
        <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-indigo-600 rounded-3xl flex items-center justify-center text-white shadow-xl shadow-indigo-100">
                <i class="fas fa-arrow-down text-xl"></i>
            </div>
            <div class="text-sm">
                <p class="font-black text-indigo-950 tracking-tight">MusiGlass Pro</p>
                <p class="text-indigo-900/40 text-[10px] font-bold uppercase tracking-widest">Instalar en Teléfono</p>
            </div>
        </div>
        <button id="install-btn" class="bg-indigo-600 text-white px-7 py-4 rounded-[1.5rem] text-[10px] font-black shadow-lg active:scale-95 transition-all uppercase tracking-widest">Añadir</button>
    </div>
    <script>
        // Fixed registration using simple relative path to avoid origin errors in sandboxed environments
        const registerServiceWorker = async () => {
            if ('serviceWorker' in navigator) {
                try {
                    // Using './sw.js' directly as it's the most compatible relative registration
                    await navigator.serviceWorker.register('./sw.js');
                    console.log('Service Worker registrado');
                } catch (error) {
                    // Soft fail for preview environments where SW might be restricted
                    console.debug('Service Worker skip:', error.message);
                }
            }
        };

        window.addEventListener('load', registerServiceWorker);
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Check if already installed
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            document.getElementById('pwa-install').style.display = 'flex';
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('pwa-install').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
