
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MusiGlass Pro Studio</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Etiquetas Meta para iOS (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MusiGlass">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png">
    
    <!-- Etiquetas Meta para Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6366f1">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        
        :root {
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.9);
            --primary: #6366f1;
        }

        body {
            background: radial-gradient(circle at 0% 0%, #f9faff, #ffffff);
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.1);
        }

        .liquid-orb {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            box-shadow: 
                0 45px 90px -15px rgba(99, 102, 241, 0.35),
                inset 0 -12px 24px rgba(0, 0, 0, 0.1),
                inset 0 12px 24px rgba(255, 255, 255, 0.3);
            border: 6px solid #ffffff;
        }

        #pwa-install {
            display: none;
            position: fixed;
            bottom: 40px;
            left: 20px;
            right: 20px;
            z-index: 2000;
            animation: slideUp 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(150px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #6366f1;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
            margin-top: -6px;
        }

        /* Ocultar scrollbars */
        ::-webkit-scrollbar { display: none; }
        body { scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <!-- Banner de Instalación PWA (Android/Chrome) -->
    <div id="pwa-install" class="glass-panel p-6 rounded-[3rem] flex items-center justify-between border-white shadow-3xl">
        <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-indigo-600 rounded-[1.5rem] flex items-center justify-center text-white shadow-xl">
                <i class="fas fa-arrow-down text-xl"></i>
            </div>
            <div class="text-sm">
                <p class="font-black text-indigo-950">MusiGlass Web App</p>
                <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest">Añadir al escritorio</p>
            </div>
        </div>
        <button id="install-btn" class="bg-indigo-950 text-white px-8 py-4 rounded-[1.8rem] text-[10px] font-black shadow-lg active:scale-95 transition-all uppercase tracking-widest">Instalar</button>
    </div>

    <script>
        const registerServiceWorker = async () => {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('./sw.js');
                } catch (error) {
                    console.debug('SW skip:', error.message);
                }
            }
        };
        window.addEventListener('load', registerServiceWorker);
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Solo mostrar si no está ya instalada
            if (!window.matchMedia('(display-mode: standalone)').matches) {
                document.getElementById('pwa-install').style.display = 'flex';
            }
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('pwa-install').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Detectar si ya es standalone para ocultar banners
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            document.getElementById('pwa-install').style.display = 'none';
        }
    </script>
</body>
</html>
